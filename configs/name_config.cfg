[nlp]
lang = "pt"
pipeline = ["ner"]
batch_size = 256

[nlp.tokenizer]
@tokenizers = "spacy.Tokenizer.v1"

[components]

[components.ner]
factory = "ner"

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
hidden_width = 64
state_type = "ner"
extra_state_tokens = false
maxout_pieces = 2
use_upper = true

[components.ner.model.tok2vec]
@architectures = "spacy.HashEmbedCNN.v2"
width = 96
depth = 4
embed_size = 2000
window_size = 1
maxout_pieces = 3
subword_features = true
pretrained_vectors = null

[training]
optimizer = {"@optimizers":"Adam.v1"}
dropout = 0.2
max_epochs = 8
seed = 42
gpu_allocator = "thinc"

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
size = {"@schedules": "compounding.v1", "start": 256.0, "stop": 512.0, "compound": 1.5}
discard_oversize = false
tolerance = 0.2

[paths]
train = "data/names_training.spacy"
dev = "data/names_dev.spacy"
